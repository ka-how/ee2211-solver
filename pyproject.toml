[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solver"
version = "0.1.0"
description = "EE2211 matrix, regression, decision tree, and clustering calculators"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.3",
    "scikit-learn>=1.8.0",
    "streamlit>=1.57.0",
    "sympy>=1.14.0",
]

[tool.setuptools]
py-modules = [
    "CommonUtils", "DecisionTreeUtils", "GradientDescent", "KMeansUtils",
    "LinearRegression", "OneHotLinearClassification", "PolynomialRegression",
    "RidgePolynomialRegression", "RidgeRegression", "pearson_correlation",
    "main", "webui",
]
